<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- daisy ui link -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- tailwindcss link -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fontAwsome link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="bg-base-200 min-h-screen">
    <div class="w-3/4 mx-auto">
      <header class="py-6 border-b">
        <div class="space-y-6">
          <h1 class="text-2xl font-bold">Job Application Tracker</h1>
          <div class="flex md:flex-row flex-col md:justify-between gap-4">
            <div
              class="bg-white w-[400px] min-w-[300px] h-[100px] min-h-[100px] flex flex-col justify-normal py-3 px-4"
            >
              Total <span class="text-2xl font-bold text-blue-500 mt-3">8</span>
            </div>
            <div
              class="bg-white w-[400px] min-w-[300px] h-[100px] min-h-[100px] flex flex-col justify-normal py-3 px-4"
            >
              Interview
              <span class="text-2xl font-bold text-green-500 mt-3">0</span>
            </div>
            <div
              class="bg-white w-[400px] min-w-[300px] h-[100px] min-h-[100px] flex flex-col justify-normal py-3 px-4"
            >
              Rejected
              <span class="text-2xl font-bold text-red-500 mt-3">0</span>
            </div>
          </div>
        </div>
      </header>

      <section class="pt-4 flex justify-between">
        <div class="space-y-4">
          <h2>Available Jobs</h2>
          <div class="flex gap-5">
            <button class="btn btn-outline btn-accent">Neutral</button>
            <button class="btn btn-outline btn-accent">Neutral</button>
            <button class="btn btn-outline btn-accent">Neutral</button>
          </div>
        </div>
        <div>8 jobs</div>
      </section>

      <section class="bg-white mt-7 rounded-lg flex justify-between">
        <div class="card pl-7">
          <p class="text-xl font-bold pt-5">Mobile First Corp</p>
          <p class="opacity-70 pb-4">React Native Developer</p>
          <p class="opacity-70 pb-4">
            Remote • Full-time • $130,000 - $175,000
          </p>
          <p
            class="text-sm font-bold bg-slate-200 py-3 w-30 text-center rounded-md mb-3"
          >
            Not Applied
          </p>
          <p class="opacity-90 mb-6">
            Build cross-platform mobile applications using React Native. Work on
            products used by millions of users worldwide.
          </p>
          <div class="flex gap-5 mb-4">
            <button class="btn btn-outline btn-accent">Interview</button>
            <button class="btn btn-outline btn-secondary">Rejected</button>
          </div>
        </div>
        <div class="pl-8">
          <i class="fa-solid fa-trash-can"></i>
        </div>
      </section>
    </div>
  </body>
</html>
